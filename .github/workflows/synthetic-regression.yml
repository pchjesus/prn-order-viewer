name: PRN Order Viewer synthetic regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run all Node.js regression tests
        run: node --test tests/*.test.cjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium and Playwright
        run: |
          python -m pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Real local HTTP browser regression
        run: |
          python tests/browser_smoke.py
          python tests/v0.6.0-browser.py
