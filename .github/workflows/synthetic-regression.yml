name: PRN Order Viewer synthetic regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# B+ CI: cancel superseded PR attempts only; retain protected main checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.scope.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/ci-scope.sh --self-test
          bash scripts/ci-scope.sh

  unit:
    needs: scope
    if: needs.scope.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run all Node.js regression tests
        run: node --test tests/*.test.cjs
  browser:
    needs: scope
    if: needs.scope.outputs.tier != 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium and Playwright
        run: |
          python -m pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Real local HTTP browser regression
        run: |
          python tests/browser_smoke.py
          python tests/v0.6.0-browser.py
